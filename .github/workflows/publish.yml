name: Publish to npm

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write   # required for npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 24 for the npm it ships (11.x). This package deliberately does
          # not commit a lockfile, so `npm install` re-resolves the whole tree on
          # every release — and npm 10, which Node 22 bundles, now crashes doing
          # it: "Cannot read properties of null (reading 'edgesOut')", an
          # arborist bug tripped by something published after 0.2.2 went out.
          # The v0.2.3 tag failed twice on this before the runner was moved up.
          # Consumers are unaffected: `engines` still allows >=18, this is only
          # the machine that builds and publishes.
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - run: npm install
      - run: npm run build

      # The sandbox tests pin the two controls this package exists to provide:
      # environment scoping and the egress allowlist. Publishing a build that
      # fails them would ship a security regression to everyone on `latest`.
      - run: npm test

      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          [ "$TAG" = "$PKG" ] || { echo "tag $TAG != package.json $PKG"; exit 1; }

      - run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
